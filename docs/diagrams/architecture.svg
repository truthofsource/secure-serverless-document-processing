<title id="title">Malware scanning and quarantine — illustrated architecture</title>
<desc id="desc">Actual Defender event, processor and file-release boundaries. Only the clean branch reaches downloads. Quarantine means private bytes and denied reads; it does not imply automatic deletion or movement.</desc>
